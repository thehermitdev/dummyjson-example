name: CI

on:
  push:
    branches:
      - agent/navigation-cache-skeleton-refinement

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4
        with:
          ref: agent/navigation-cache-skeleton-refinement

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Format sources
        run: bun run format

      - name: Fix lintable issues
        run: bun run lint:fix

      - name: Commit source normalization when needed
        shell: bash
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: normalize refinement sources"
            git pull --rebase origin agent/navigation-cache-skeleton-refinement
            git push origin HEAD:agent/navigation-cache-skeleton-refinement
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
